<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Upload Resource - Student Hub</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>
    body {
        background: #f5f7fb;
        font-family: Arial, sans-serif;
    }

    .upload-container {
        max-width: 700px;
        margin: 50px auto;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .upload-title {
        text-align: center;
        margin-bottom: 30px;
        font-weight: bold;
    }

    .form-label {
        font-weight: 600;
    }

    .upload-btn {
        width: 100%;
        padding: 12px;
        font-size: 17px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        background: #0d6efd;
        color: white;
    }

    .upload-btn:hover {
        background: #0b5ed7;
    }

    #message {
        margin-bottom: 20px;
    }

    .back-btn {
        display: inline-block;
        margin-bottom: 20px;
        text-decoration: none;
    }
</style>
```

</head>

<body>

```
<div class="container">

    <div class="upload-container">

        <a href="resources.html" class="back-btn">
            ← Back to Resources
        </a>

        <h2 class="upload-title">
            📤 Upload Resource
        </h2>

        <!-- MESSAGE WILL APPEAR HERE -->
        <div id="message"></div>

        <form
            id="uploadForm"
            enctype="multipart/form-data">

            <!-- TITLE -->
            <div class="mb-3">
                <label for="title" class="form-label">
                    Resource Title
                </label>

                <input
                    type="text"
                    id="title"
                    class="form-control"
                    placeholder="Enter resource title"
                    required>
            </div>

            <!-- SUBJECT -->
            <div class="mb-3">
                <label for="subject" class="form-label">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    class="form-control"
                    placeholder="Enter subject"
                    required>
            </div>

            <!-- CATEGORY -->
            <div class="mb-3">
                <label for="category" class="form-label">
                    Category
                </label>

                <select
                    id="category"
                    class="form-select"
                    required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Notes">
                        Notes
                    </option>

                    <option value="Question Papers">
                        Question Papers
                    </option>

                    <option value="Assignments">
                        Assignments
                    </option>

                    <option value="Projects">
                        Projects
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
                <label for="description" class="form-label">
                    Description
                </label>

                <textarea
                    id="description"
                    class="form-control"
                    rows="4"
                    placeholder="Enter resource description"
                    required></textarea>
            </div>

            <!-- FILE -->
            <div class="mb-3">
                <label for="file" class="form-label">
                    Select File
                </label>

                <input
                    type="file"
                    id="file"
                    class="form-control"
                    accept=".pdf,.ppt,.pptx,.png,.jpg,.jpeg"
                    required>

                <small class="text-muted">
                    Allowed: PDF, PPT, PPTX, PNG, JPG, JPEG
                    | Maximum size: 10 MB
                </small>
            </div>

            <!-- SUBMIT -->
            <button
                type="submit"
                id="uploadBtn"
                class="upload-btn">

                📤 Upload Resource

            </button>

        </form>

    </div>

</div>

<script src="upload.js"></script>
```

</body>

</html>
