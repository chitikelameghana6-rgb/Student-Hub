<head>

<meta

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family:
            "Segoe UI",
            Arial,
            sans-serif;

        background:
            radial-gradient(
                circle at top left,
                #dbeafe,
                transparent 35%

            radial-gradient(
                circle at bottom right,
                #e0e7ff,
                transparent 35%

            #f8fafc;

        display: flex;

        background: rgba(255, 255, 255, 0.97);

        border: 1px solid #e8edf5;

        padding: 40px;

        box-shadow:

        margin-bottom: 28px;

        margin-bottom: 7px;

        border: 1px solid #dbe3ef;
        border-radius: 10px;

        padding: 10px 14px;

        font-size: 14px;

        transition: 0.2s ease;
    }

    .form-control:focus {
        border-color: #2563eb;

        box-shadow:
            0 0 0 3px

    }

        margin-top: 6px;

        font-size: 12px;
        color: #64748b;

    .register-btn {
        width: 100%;
        height: 48px;

        border: none;
        border-radius: 10px;

        background: #2563eb;
        color: white;

        font-size: 15px;
        font-weight: 700;

        cursor: pointer;

        box-shadow:
            0 8px 20px
            rgba(37, 99, 235, 0.18);

        transition: 0.25s ease;
    }

    .register-btn:hover {
        background: #1d4ed8;

        transform: translateY(-2px);

        box-shadow:
            0 12px 25px
            rgba(37, 99, 235, 0.24);
    }

    .register-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
    }

    .login-link {
        text-align: center;

        margin-top: 24px;

        font-size: 14px;

    }

    .login-link a {
        color: #2563eb;

        font-weight: 700;

        text-decoration: none;
    }

    .login-link a:hover {

    #message .alert {

        .register-card {

        }

<body>

```
<div class="register-wrapper">

    <div class="register-card">

        <div class="brand-section">

            <div class="brand-icon">
                🎓
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Join Student Hub and start sharing resources
            </p>

        </div>


        <div id="message"></div>


        <form id="registerForm">

            <div class="mb-3">

                <label
                    for="name"
                    class="form-label">

                    Full Name

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email address"
                    required>

            </div>


            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Create a password"
                    required>

                <div class="password-note">
                    Use at least 6 characters.
                </div>

            </div>


            <div class="mb-4">

                <label
                    for="confirmPassword"
                    class="form-label">

                    Confirm Password

                </label>

                <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>

            </div>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script>

    const registerForm =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const registerBtn =
        document.getElementById("registerBtn");


    registerForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const name =
                document.getElementById("name")
                    .value
                    .trim();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                    .value;


            message.innerHTML = "";


            if (password.length < 6) {

                message.innerHTML = `
                    <div class="alert alert-danger">
                        Password must be at least 6 characters.
                    </div>
                `;

                return;

            }


            if (password !== confirmPassword) {

                message.innerHTML = `
                    <div class="alert alert-danger">
                        Passwords do not match.
                    </div>
                `;

                return;

            }


            registerBtn.disabled = true;

            registerBtn.innerText =
                "Creating Account...";


            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Register response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Registration failed"
                    );

                }


                message.innerHTML = `
                    <div class="alert alert-success">
                        Account created successfully!
                        Redirecting to login...
                    </div>
                `;


                registerForm.reset();


                setTimeout(() => {

                    window.location.href =
                        "login.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Registration error:",
                    error
                );


                message.innerHTML = `
                    <div class="alert alert-danger">
                        ${error.message}
                    </div>
                `;

            } finally {

                registerBtn.disabled = false;

                registerBtn.innerText =
                    "Create Account";

            }

        }
    );

</script>


</body>

</html>
