<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Student Hub - Login</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>

    body {
        min-height: 100vh;
        background:
            radial-gradient(
                circle at top left,
                #dbeafe,
                transparent 35%
            ),
            radial-gradient(
                circle at bottom right,
                #e0e7ff,
                transparent 35%
            ),
            #f8fafc;

        font-family:
            "Segoe UI",
            Arial,
            sans-serif;
    }

    .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }

    .login-card {
        width: 100%;
        max-width: 440px;
        border: none;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow:
            0 20px 50px rgba(15, 23, 42, 0.12);
        overflow: hidden;
    }

    .login-card-body {
        padding: 42px;
    }

    .brand {
        text-align: center;
        margin-bottom: 8px;
        color: #2563eb;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        margin-bottom: 30px;
        font-size: 15px;
    }

    .form-label {
        color: #334155;
        font-weight: 600;
        font-size: 14px;
    }

    .form-control {
        min-height: 48px;
        border-radius: 10px;
        border: 1px solid #dbe3ef;
        padding: 12px 14px;
        transition: 0.2s ease;
    }

    .form-control:focus {
        border-color: #2563eb;
        box-shadow:
            0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-button {
        min-height: 48px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        font-weight: 700;
        box-shadow:
            0 8px 20px rgba(37, 99, 235, 0.18);
        transition: 0.25s ease;
    }

    .login-button:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow:
            0 12px 25px rgba(37, 99, 235, 0.25);
    }

    .login-button:disabled {
        opacity: 0.7;
        transform: none;
    }

    .register-text {
        color: #64748b;
        font-size: 14px;
    }

    .register-link,
    .home-link {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }

    .register-link:hover,
    .home-link:hover {
        color: #1d4ed8;
        text-decoration: underline;
    }

    .home-link {
        font-size: 14px;
    }

    #message .alert {
        border-radius: 10px;
        font-size: 14px;
    }

    @media (max-width: 500px) {

        .login-card-body {
            padding: 30px 22px;
        }

        .brand {
            font-size: 27px;
        }

    }

</style>

</head>

<body>

```
<div class="login-wrapper">

    <div class="login-card">

        <div class="login-card-body">

            <h1 class="brand">
                Student Hub
            </h1>

            <p class="subtitle">
                Login to access your student resources
            </p>


            <div id="message"></div>


            <form id="loginForm">

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100 login-button"
                    id="loginBtn">

                    Login

                </button>

            </form>


            <div class="text-center mt-4">

                <span class="register-text">
                    New student?
                </span>

                <a
                    href="register.html"
                    class="register-link">

                    Create another account

                </a>

            </div>


            <div class="text-center mt-3">

                <a
                    href="index.html"
                    class="home-link">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");

    const loginBtn =
        document.getElementById("loginBtn");


    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;


            message.innerHTML = "";

            loginBtn.disabled = true;

            loginBtn.innerText =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Login response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Invalid email or password"
                    );

                }


                if (!data.token) {

                    throw new Error(
                        "Login successful, but token was not received."
                    );

                }


                localStorage.setItem(
                    "token",
                    data.token
                );


                message.innerHTML = `
                    <div class="alert alert-success">
                        Login successful! Redirecting...
                    </div>
                `;


                setTimeout(() => {

                    if (
                        data.user &&
                        data.user.role === "admin"
                    ) {

                        window.location.href =
                            "admin.html";

                    } else {

                        window.location.href =
                            "dashboard.html";

                    }

                }, 700);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                message.innerHTML = `
                    <div class="alert alert-danger">
                        ${error.message}
                    </div>
                `;

            } finally {

                loginBtn.disabled = false;

                loginBtn.innerText =
                    "Login";

            }

        }
    );

</script>


</body>

</html>
